<style>
  :root { --bg:#0f1115; --card:#181b21; --text:#e6e8eb; --muted:#9aa3ad; --line:#2a2f37; --lime:#CFEF20; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(15,17,21,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .bar { max-width:1240px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }

  nav a { color:var(--muted); text-decoration:none; font-size:.8rem; padding:4px 9px; border-radius:6px; border:1px solid transparent; }
  nav a:hover, nav a.on { color:var(--lime); border-color:var(--lime); }
  .tools { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:.8rem; color:var(--muted); }
  .tools a, .tools button { font:inherit; color:var(--lime); background:none; border:1px solid var(--lime); border-radius:6px; padding:4px 10px; cursor:pointer; text-decoration:none; }
  main { max-width:1240px; margin:0 auto; padding:22px 20px 80px; }
  .slide { margin:0 0 26px; scroll-margin-top:96px; }
  .slide img { width:100%; height:auto; display:block; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; background:#000; aspect-ratio:16/9; }
  figcaption { display:flex; gap:12px; align-items:baseline; margin:8px 4px 0; font-size:.85rem; color:var(--muted); }
  .pg { font-variant-numeric:tabular-nums; color:var(--lime); font-weight:700; }
  #lb { position:fixed; inset:0; background:#000; display:none; z-index:50; align-items:center; justify-content:center; }
  #lb.on { display:flex; }
  #lb img { max-width:100vw; max-height:100vh; }
  #lb .hint { position:fixed; top:12px; right:16px; color:#fff; font-size:.85rem; background:rgba(255,255,255,.12); padding:4px 10px; border-radius:6px; }
  #lb .nb { position:fixed; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); color:#fff; border:0; font-size:2rem; width:56px; height:80px; cursor:pointer; border-radius:8px; }
  #lb .prev { left:12px; } #lb .next { right:12px; }
  .imgw { position:relative; }
  .hot { position:absolute; left:61.5%; top:89%; width:27%; height:5.2%; border-radius:4px; }
  .hot:hover { outline:2px solid #CFEF20; outline-offset:2px; }
  footer { max-width:1240px; margin:0 auto; padding:0 20px 40px; color:var(--muted); font-size:.85rem; }

<div id="lb"><span class="hint">← → 이동 · Esc 또는 클릭으로 닫기</span><button class="nb prev">‹</button><div class="lbw" style="position:relative"><img alt=""><a class="hot" id="lbhot" href="https://see2you.github.io/HyeonPortfolio/" target="_blank" rel="noopener" style="display:none"></a></div><button class="nb next">›</button></div>
<script>
  const N=45, imgs=[...document.querySelectorAll('.slide img')], lb=document.getElementById('lb'), lbi=lb.querySelector('img');
  let cur=1;
  const show=n=>{ cur=Math.max(1,Math.min(N,n)); lbi.src=`nx3_slides/slide_${String(cur).padStart(2,'0')}.webp`; document.getElementById('lbhot').style.display = cur===N ? 'block' : 'none'; lb.classList.add('on'); document.body.style.overflow='hidden'; };
  const hide=()=>{ lb.classList.remove('on'); document.body.style.overflow=''; document.getElementById('s'+cur).scrollIntoView({block:'start'}); };
  imgs.forEach(im=>im.addEventListener('click',()=>show(+im.dataset.n)));
  document.getElementById('full').onclick=()=>show(1);
  lb.querySelector('.prev').onclick=e=>{e.stopPropagation();show(cur-1);};
  lb.querySelector('.next').onclick=e=>{e.stopPropagation();show(cur+1);};
  lbi.onclick=e=>{e.stopPropagation();show(cur+1);};
  document.getElementById('lbhot').onclick=e=>e.stopPropagation();
  lb.onclick=hide;
  document.addEventListener('keydown',e=>{ if(!lb.classList.contains('on')) return; if(e.key==='Escape') hide(); if(e.key==='ArrowRight'||e.key===' ') show(cur+1); if(e.key==='ArrowLeft') show(cur-1); });
  // highlight nav by scroll
  const starts=[1, 2, 3, 4, 5, 7, 12, 19, 28, 35, 40, 44]; const links=[...document.querySelectorAll('#nav a')];
  const io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ const n=+e.target.id.slice(1); let idx=0; starts.forEach((s,i)=>{ if(n>=s) idx=i; }); links.forEach((a,i)=>a.classList.toggle('on',i===idx)); } }); },{rootMargin:'-40% 0px -55% 0px'});
  document.querySelectorAll('.slide').forEach(s=>io.observe(s));
</script>
