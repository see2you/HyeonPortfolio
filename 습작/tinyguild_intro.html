<style>
:root{--night:#1a130f;--soil:#2b2019;--line:#4a382b;--bone:#f1e6cc;--muted:#b9a789;--gold:#f2bb4b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--bone);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(26,19,15,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header h1{margin:0;font:400 22px 'Do Hyeon','Noto Sans KR',sans-serif;flex:1;min-width:0}
header h1 span{color:var(--muted);font-family:'Noto Sans KR',sans-serif;font-size:13px;margin-left:8px}
.btn{font:400 16px 'Do Hyeon','Noto Sans KR',sans-serif;background:var(--gold);color:#1f1712;border:0;border-radius:6px;padding:8px 14px 7px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--bone);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:28px}
.frame{margin:0;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.note{font-size:14px;line-height:1.6;color:var(--muted);display:flex;gap:10px}
.note .num{font-family:'Do Hyeon',sans-serif;color:var(--gold);font-size:16px;flex:none}
body.nonotes .note{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 40px}
/* slide canvas */
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
.slide *{margin:0}
.slide ul{padding-left:1.15em}
.slide img{display:block}
/* present mode */
#present{position:fixed;inset:0;z-index:20;background:#0d0907;display:flex;align-items:center;justify-content:center}
#present .stage{border:0;border-radius:0;cursor:default;aspect-ratio:auto}
#pbar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:21;opacity:.2;transition:opacity .2s}
#pbar:hover,#pbar:focus-within{opacity:1}
#pcount{font:400 16px 'Do Hyeon',sans-serif;color:var(--bone);flex:1;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#pbar{transition:none}}
</style>

</section><figcaption class="note"><span class="num">06</span>타이니 타워의 상점은 입고하면 자동으로 팔리지만, 타이니 길드는 문라이터처럼 플레이어가 가격을 정합니다. 손님 표정으로 적정가를 찾고, 찾은 가격은 장부에 남아서 다음부터는 자동으로 적용됩니다. 방치형이라 반복 작업은 줄이고, 새 아이템과 유행 품목에만 판단이 몰리게 했습니다.</figcaption></figure>

<div style="display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;color:#b4501f;letter-spacing:4px;font-weight:500">파견 · 게시판</p>
<h2 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:72px;font-weight:400;line-height:1.15;color:#2b1d12">의뢰 등급에서 전리품까지</h2>
</div>
<div style="display:flex;gap:24px;align-items:start">
<div style="width:72px;height:72px;border-radius:36px;background:#2b1d12;display:flex;align-items:center;justify-content:center"><p style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;color:#f2bb4b">1</p></div>
<div style="flex:1;display:flex;flex-direction:column;gap:12px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#2b1d12">의뢰 등장</h3>
<p style="font-size:32px;line-height:1.45;color:#5a4636">게시판 레벨이 오를수록 높은 등급의 의뢰가 뜬다</p>
<div style="display:flex;gap:12px">
<p style="font-size:24px;color:#fbf6ea;background:#6b655d;padding:6px 16px;border-radius:8px">일반</p>
<p style="font-size:24px;color:#fbf6ea;background:#3d7a31;padding:6px 16px;border-radius:8px">고급</p>
<p style="font-size:24px;color:#fbf6ea;background:#2d68a3;padding:6px 16px;border-radius:8px">희귀</p>
<p style="font-size:24px;color:#fbf6ea;background:#7a43a6;padding:6px 16px;border-radius:8px">영웅</p>
<p style="font-size:24px;color:#fbf6ea;background:#a8620f;padding:6px 16px;border-radius:8px">전설</p>
</div>
</div>
</div>
<div style="display:flex;gap:24px;align-items:start">
<div style="width:72px;height:72px;border-radius:36px;background:#2b1d12;display:flex;align-items:center;justify-content:center"><p style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;color:#f2bb4b">2</p></div>
<div style="flex:1;display:flex;flex-direction:column;gap:12px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#2b1d12">결과 판정</h3>
<p style="font-size:32px;line-height:1.45;color:#5a4636">파티 전투력 ÷ 권장 전투력으로 대성공 · 성공 · 부분 성공 · 실패가 갈린다</p>
</div>
</div>
<div style="display:flex;gap:24px;align-items:start">
<div style="width:72px;height:72px;border-radius:36px;background:#2b1d12;display:flex;align-items:center;justify-content:center"><p style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;color:#f2bb4b">3</p></div>
<div style="flex:1;display:flex;flex-direction:column;gap:12px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#2b1d12">전리품 획득</h3>
<p style="font-size:32px;line-height:1.45;color:#5a4636">의뢰마다 고유한 보상 테이블. 결과가 좋을수록 귀한 아이템이 나오고, 수량도 확률로 정해진다</p>
</div>
</div>
</div>
</section><figcaption class="note"><span class="num">07</span>파견은 조작 없이 자동으로 진행됩니다. 게시판 레벨이 의뢰 등급의 등장 확률을 정하고, 파티 전투력과 권장 전투력의 비율이 결과를 정하고, 결과 등급이 받을 수 있는 아이템을 거릅니다. 왼쪽 화면처럼 길드원을 고르는 순간 확률 막대가 바로 바뀌어서, 누구를 보낼지가 곧 판단이 됩니다.</figcaption></figure>
<figure class="frame" data-i="7"><section id="board" class="slide" role="group" aria-label="슬라이드 8" style="background:#1f1712;color:#f1e6cc;font-family:'Noto Sans KR', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;color:#f2bb4b;letter-spacing:4px;font-weight:500">게시판 운영</p>
<h2 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:72px;font-weight:400;line-height:1.15;color:#f1e6cc">의뢰 목록이 바뀌는 네 가지 규칙</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:24px">
<div style="display:flex;flex-direction:column;gap:12px;background:#2e221a;border:2px solid #4a382b;border-radius:20px;padding:36px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#f2bb4b">자동 갱신</h3>
<p style="font-size:32px;line-height:1.45;color:#cdbb9c">일정 시간마다 새 의뢰. 파견 중이거나 고정한 의뢰는 남는다.</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#2e221a;border:2px solid #4a382b;border-radius:20px;padding:36px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#f2bb4b">수동 갱신</h3>
<p style="font-size:32px;line-height:1.45;color:#cdbb9c">재화를 써서 바로 다시 뽑는다. 높은 등급을 노리는 선택.</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#2e221a;border:2px solid #4a382b;border-radius:20px;padding:36px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#f2bb4b">슬롯 고정</h3>
<p style="font-size:32px;line-height:1.45;color:#cdbb9c">좋은 의뢰를 잠가 두고 나머지만 갱신한다.</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#2e221a;border:2px solid #4a382b;border-radius:20px;padding:36px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#f2bb4b">천장</h3>
<p style="font-size:32px;line-height:1.45;color:#cdbb9c">희귀 이상이 한동안 안 뜨면 다음 갱신에서 1개 보장.</p>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;border:2px solid #4a382b;border-radius:20px;padding:32px 36px">
<p style="font-size:24px;color:#f2bb4b;letter-spacing:2px">수동 갱신 비용 (하루 기준, 매일 초기화)</p>
<p style="font-size:32px;color:#f1e6cc">1~2회 무료 → 3~5회 코인 (회차마다 증가) → 6회부터 보석</p>
</div>
</section><figcaption class="note"><span class="num">08</span>게시판은 자동으로 갱신되고, 재화를 쓰면 바로 다시 뽑을 수도 있습니다. 슬롯 고정이 있어서 좋은 의뢰를 지키려고 갱신을 못 하는 딜레마가 없고, 천장이 있어서 낮은 확률의 고등급 의뢰도 언젠가는 반드시 뜹니다. 프로토타입에서는 8회를 천장으로 잡았습니다.</figcaption></figure>
<figure class="frame" data-i="8"><section id="choice" class="slide" role="group" aria-label="슬라이드 9" style="background:#e0672e;color:#1f1712;font-family:'Noto Sans KR', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
<div style="display:flex;flex-direction:column;gap:24px">
<p style="font-size:24px;color:#1f1712;letter-spacing:4px;font-weight:700">핵심 의사결정</p>
<h1 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:120px;font-weight:400;line-height:1.05;color:#1f1712">팔 것인가,<br>쓸 것인가.</h1>
<p style="font-size:44px;line-height:1.3;color:#1f1712">같은 전리품을 두고 상점 수익과 길드원 성장이 경쟁한다</p>
</div>
<div style="display:flex;gap:32px">
<div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#1f1712;border-radius:20px;padding:36px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#f2bb4b">판매 ↔ 분해</h3>
<p style="font-size:32px;line-height:1.45;color:#f1e6cc">지금 코인이 필요한가, 더 비싼 상품의 재료가 필요한가</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#1f1712;border-radius:20px;padding:36px">
<h3 style="font-family:'Do Hyeon', 'Noto Sans KR', sans-serif;font-size:44px;font-weight:400;color:#f2bb4b">판매용 제작 ↔ 장착용 제작</h3>

<div id="present" hidden><div class="stage" id="pstage"></div></div>
<div id="pbar" hidden><button class="btn ghost" id="prev" aria-label="이전 슬라이드">이전</button><span id="pcount" aria-live="polite"></span><button class="btn ghost" id="next" aria-label="다음 슬라이드">다음</button><button class="btn ghost" id="fs">전체 화면</button><button class="btn" id="close">닫기</button></div>
<script>
(()=>{
const frames=[...document.querySelectorAll('.frame')];
frames.forEach(f=>{const st=document.createElement('div');st.className='stage';const s=f.querySelector('.slide');f.insertBefore(st,f.firstChild);st.appendChild(s);st.addEventListener('click',()=>open(+f.dataset.i))});
const fit=st=>{const s=st.querySelector('.slide');if(!s)return;const k=Math.min(st.clientWidth/1920,st.clientHeight/1080);s.style.transform=`translate(${(st.clientWidth-1920*k)/2}px,${(st.clientHeight-1080*k)/2}px) scale(${k})`};
const ro=new ResizeObserver(es=>es.forEach(e=>fit(e.target)));
document.querySelectorAll('.stage').forEach(st=>ro.observe(st));
const P=document.getElementById('present'),PS=document.getElementById('pstage'),bar=document.getElementById('pbar'),cnt=document.getElementById('pcount');
let cur=-1;
function show(i){cur=Math.max(0,Math.min(frames.length-1,i));PS.innerHTML='';PS.appendChild(frames[cur].querySelector('.slide').cloneNode(true));sizeP();cnt.textContent=(cur+1)+' / '+frames.length;try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
function sizeP(){PS.style.width=innerWidth+'px';PS.style.height=innerHeight+'px';fit(PS)}
function open(i){P.hidden=false;bar.hidden=false;document.body.style.overflow='hidden';show(i)}
function close(){P.hidden=true;bar.hidden=true;document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});frames[cur]&&frames[cur].scrollIntoView({block:'center'});cur=-1}
addEventListener('resize',()=>{if(cur>=0)sizeP()});
document.getElementById('startBtn').onclick=()=>open(0);
document.getElementById('close').onclick=close;
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('fs').onclick=()=>{const r=document.documentElement;(document.fullscreenElement?document.exitFullscreen():r.requestFullscreen&&r.requestFullscreen()).catch?.(()=>{})};
P.addEventListener('click',e=>{if(e.clientX<innerWidth/3)show(cur-1);else show(cur+1)});
let tx=null;P.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
P.addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40){show(cur+(d<0?1:-1))}tx=null});
addEventListener('keydown',e=>{if(cur<0)return;if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(cur+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(frames.length-1);else if(e.key==='Escape')close();else if(e.key==='f'||e.key==='F')document.getElementById('fs').click()});
const tn=document.getElementById('toggleNotes');tn.onclick=()=>{const off=document.body.classList.toggle('nonotes');tn.textContent=off?'설명 보기':'설명 숨기기';tn.setAttribute('aria-pressed',String(!off))};
const h=parseInt(location.hash.slice(1));if(h>=1&&h<=frames.length)open(h-1);
})();
</script>
