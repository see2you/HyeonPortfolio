<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a130f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>타이니 길드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen portrait diorama — resource bar, a cutaway guild that scrolls down into the earth, a tab bar; every panel is a parchment bottom sheet */
:root{
  --night:#1a130f; --soil:#2b2019; --soil2:#3a2b21; --line:#5a4535;
  --parch:#efe2c4; --parch2:#e4d3ae; --parch3:#d6c08f; --ink:#2b1d12; --ink2:#6b5440;
  --bone:#f3ead6; --muted:#b9a789; --gold:#f2bb4b; --gold2:#b8862a; --ember:#e0672e; --moss:#6f9a4a; --gem:#7fd6e6; --danger:#b04a3a;
  --g0:#8f887f; --g1:#4f9e40; --g2:#3a82c8; --g3:#9655c8; --g4:#e08a1a;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pixel:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
html{background:var(--night);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);box-sizing:border-box;position:relative}
@media (max-width:520px){
 #app{max-width:none;padding-left:0;padding-right:0}
 #app #hud,#app #tut,#app #nav{margin-left:10px;margin-right:10px}
 #app #towerWrap{border-left:0;border-right:0;border-radius:0}
 #app #toasts{left:10px;right:10px}
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
#hud{display:flex;align-items:center;gap:8px;padding-block:10px 8px;flex-wrap:wrap}
.res{display:flex;align-items:center;gap:6px;background:var(--soil2);border:2px solid var(--line);border-radius:4px;padding:3px 9px 3px 6px;font-family:var(--pixel);font-size:13px;font-variant-numeric:tabular-nums;min-width:62px}
.ic-coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 var(--gold2);display:inline-block;flex:none}
.ic-gem{width:10px;height:10px;background:var(--gem);transform:rotate(45deg);box-shadow:inset -2px -2px 0 #3f9fb3;display:inline-block;flex:none;margin:0 1px}
#tier{font-family:var(--display);font-size:15px;color:var(--muted);margin-left:auto;white-space:nowrap}
#trend{width:100%;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
#trend b{color:var(--gold);font-weight:400;font-family:var(--display);font-size:14px}
.speed{font-family:var(--pixel);font-size:9px;letter-spacing:.06em;color:var(--ink);background:var(--muted);padding:1px 5px;border-radius:2px;margin-left:auto}

/* Tutorial */
#tut{background:var(--parch);color:var(--ink);border-radius:4px;padding:7px 10px;font-size:13px;line-height:1.45;display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;border-left:4px solid var(--ember)}
#tut .lbl{font-family:var(--display);font-size:13px;color:var(--ember);white-space:nowrap;padding-top:1px}

/* Tower */
#towerWrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border:3px solid var(--line);border-radius:6px;background:#241a14;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
#tower{position:relative;width:100%}
#cv{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:pan-y}
#ov,#fx{position:absolute;inset:0;pointer-events:none}
.chip{position:absolute;font-family:var(--display);font-size:12px;line-height:1;background:rgba(26,19,15,.78);color:var(--bone);padding:3px 6px 2px;border-radius:3px;white-space:nowrap}
.chip.dim{color:var(--muted)}
.ovbtn{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);font-family:var(--display);font-size:15px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:5px 12px 4px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.ovbtn:active{transform:translate(-50%,-48%);box-shadow:0 1px 0 var(--ink)}
.ovbtn small{font-family:var(--pixel);font-size:10px;margin-left:6px}
.digbar{position:absolute;transform:translate(-50%,0);width:46%;height:16px;background:rgba(26,19,15,.85);border:2px solid var(--ink);border-radius:3px;overflow:hidden}
.digbar i{display:block;height:100%;background:var(--ember)}
.digbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:10px;color:var(--bone)}
.mark{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-size:16px;background:var(--gold);color:var(--ink);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translate(-50%,-125%)}}
.fl{position:absolute;transform:translate(-50%,-100%);font-family:var(--pixel);font-size:12px;color:var(--gold);text-shadow:1px 1px 0 #000,-1px 0 0 #000;white-space:nowrap;animation:up 1.2s ease-out forwards}
.fl.white{color:var(--bone)}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--ink);border-radius:9px;padding:0 3px;font-size:13px;line-height:18px;animation:pop 1.5s ease-out forwards}
@keyframes pop{0%{opacity:0;margin-top:4px}12%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-6px}}

/* Crate button */
#crateBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;z-index:5;font-family:var(--display);font-size:16px;background:var(--ember);color:var(--bone);border:2px solid var(--ink);border-radius:4px;padding:8px 16px 7px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}

#lordBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:124px;z-index:5;font-family:var(--display);font-size:16px;background:#6a2a8a;color:var(--bone);border:2px solid var(--ink);border-radius:4px;padding:8px 16px 7px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.pick:disabled{opacity:.45}
/* Nav */
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:10px 12px}
#nav button{position:relative;background:var(--soil2);border:2px solid var(--line);border-radius:4px;padding:8px 0 6px;font-family:var(--display);font-size:16px;color:var(--bone);display:flex;flex-direction:column;align-items:center;gap:4px}
#nav button .nic{width:22px;height:22px;image-rendering:pixelated}
#nav button.locked{color:var(--line)}
#nav button.locked .nic{opacity:.3}
.badge{position:absolute;top:-6px;right:-4px;background:var(--ember);color:var(--bone);font-family:var(--pixel);font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--night)}

/* Sheet */
#sheet{position:absolute;inset:0;background:rgba(10,7,5,.55);z-index:10;display:flex;align-items:flex-end}
.sheet-card{width:100%;max-height:82%;display:flex;flex-direction:column;background:var(--parch);color:var(--ink);border-radius:10px 10px 0 0;border-top:3px solid var(--line);box-shadow:0 -6px 0 rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;border-bottom:2px dashed var(--parch3)}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;flex:1;text-wrap:balance}
.sheet-head .x{background:none;border:2px solid var(--ink2);border-radius:4px;padding:2px 10px;font-family:var(--display);font-size:15px;color:var(--ink2)}
#sheetBody{overflow-y:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sec{font-family:var(--display);font-size:16px;color:var(--ink2);margin-top:4px;display:flex;align-items:center;gap:8px}
.sec .r{margin-left:auto;font-family:var(--body);font-size:12px}
.card{background:var(--parch2);border:2px solid var(--parch3);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.grow{flex:1;min-width:0}
.name{font-family:var(--display);font-size:17px}
.meta{font-size:12px;color:var(--ink2);line-height:1.5}
.num{font-family:var(--pixel);font-size:12px;font-variant-numeric:tabular-nums}
.btn{font-family:var(--display);font-size:15px;background:var(--ink);color:var(--parch);border:none;border-radius:4px;padding:7px 12px 6px;box-shadow:0 3px 0 #000;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--gold2)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink2);box-shadow:none;padding:5px 10px 4px}
.btn.sm{font-size:13px;padding:5px 9px 4px}
.btn:disabled{opacity:.38;pointer-events:none}
.gp{font-family:var(--display);font-size:13px;color:#fff;padding:2px 7px 1px;border-radius:3px;white-space:nowrap}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;font-family:var(--display);font-size:16px;background:transparent;border:2px solid var(--ink2);border-radius:4px;padding:6px 0 5px;color:var(--ink2)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--parch)}
.pbar{display:flex;height:16px;border-radius:3px;overflow:hidden;border:2px solid var(--ink)}
.pbar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend span::before{content:"";width:9px;height:9px;background:var(--c);border-radius:2px}
.prog{height:8px;background:var(--parch3);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ember)}
.prog.exp i{background:var(--moss)}
.slot input[type=range]{flex:1;min-width:120px;accent-color:var(--ember)}
.react{font-size:18px;line-height:1}
.mem{display:flex;align-items:center;gap:10px}
.mem canvas{width:30px;height:54px;image-rendering:pixelated;flex:none}
.pick{display:flex;align-items:center;gap:10px;background:var(--parch2);border:2px solid var(--parch3);border-radius:6px;padding:8px 10px;text-align:left;width:100%}
.pick.on{border-color:var(--ink);background:var(--parch3)}
.pick canvas{width:24px;height:24px;image-rendering:pixelated;flex:none}
.ico{width:24px;height:24px;image-rendering:pixelated;flex:none}
.big{font-family:var(--display);font-size:34px;line-height:1.1;text-align:center}
.mini{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.mini th,.mini td{padding:3px 4px;text-align:center;border-bottom:1px solid var(--parch3)}
.mini th{font-family:var(--display);font-weight:400;font-size:13px}
.note{font-size:12px;color:var(--ink2);line-height:1.5}
.warn{color:var(--danger)}

#toasts{position:absolute;left:16px;right:16px;top:8px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:var(--parch);font-size:13px;padding:7px 12px;border-radius:4px;border:2px solid var(--gold);animation:toast 2.6s ease forwards;max-width:100%;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}.fl,.bub,.toast{animation-duration:.01s;animation-delay:1s}}
</style>

</head>
<body>
<div id="app">
  <header id="hud">
    <div class="res" title="코인"><i class="ic-coin"></i><span id="coins">0</span></div>
    <div class="res" title="보석"><i class="ic-gem"></i><span id="gems">0</span></div>
    <div id="tier">목조 오두막</div>
    <div id="trend"></div>
  </header>
  <div id="tut"><span class="lbl">길드 안내</span><span id="tutText"></span></div>
  <main id="towerWrap"><div id="tower"><canvas id="cv"></canvas><div id="ov"></div><div id="fx"></div></div></main>
  <button id="crateBtn" hidden>전리품 운반하기</button>
  <button id="lordBtn" hidden>영주의 의뢰 듣기</button>
  <nav id="nav">
    <button id="nBoard" data-nav="board"><canvas class="nic" width="11" height="11"></canvas>게시판<span class="badge" hidden></span></button>
    <button id="nMem" data-nav="members"><canvas class="nic" width="11" height="11"></canvas>길드원</button>
    <button id="nInv" data-nav="storage"><canvas class="nic" width="11" height="11"></canvas>창고</button>
    <button id="nLed" data-nav="ledger"><canvas class="nic" width="11" height="11"></canvas>장부</button>
  </nav>
  <div id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose">닫기</button></div><div id="sheetBody"></div></div></div>
  <div id="toasts" aria-live="polite"></div>
</div>

<script>
(()=>{
'use strict';
/* ───────── data ───────── */
const W=160, FH=40, SKY=70, RX0=14, RX1=140, LX0=142, LX1=156;
const GR=[{n:'일반',c:'#8f887f'},{n:'고급',c:'#4f9e40'},{n:'희귀',c:'#3a82c8'},{n:'영웅',c:'#9655c8'},{n:'전설',c:'#e08a1a'},{n:'영주',c:'#b0303a'}];
const RESN=['실패','부분 성공','성공','대성공'], RESC=['#b04a3a','#c9a23a','#4f9e40','#e08a1a'];
const CAT={mat:'재료',con:'소비',eq:'장비',orb:'오브',val:'귀중품',good:'제작품',gear:'장착 장비'};
const IT={
 bread:{n:'빵',cat:'con',b:6,c:'#d9a35b'}, torch:{n:'횃불',cat:'con',b:8,c:'#e0672e'}, rope:{n:'밧줄',cat:'mat',b:5,c:'#b89566'},
 iron_scrap:{n:'낡은 철 조각',cat:'mat',b:5,c:'#8f9399'}, herb:{n:'약초',cat:'mat',b:4,c:'#6fae4a'}, leather:{n:'질긴 가죽',cat:'mat',b:7,c:'#9a6438'},
 wolf_pelt:{n:'늑대 가죽',cat:'mat',b:14,c:'#c9c3b8'}, mithril:{n:'미스릴 원석',cat:'mat',b:45,c:'#8fe0e6'},
 potion_s:{n:'하급 포션',cat:'con',b:15,c:'#d8473a',dis:{herb:1}},
 goblin_dagger:{n:'고블린 단검',cat:'eq',b:28,c:'#a8b0a0',dis:{iron_scrap:3}},
 bone_shield:{n:'뼈 방패',cat:'eq',b:40,c:'#e6dcc2',dis:{iron_scrap:2,leather:1}},
 green_orb:{n:'녹색 오브',cat:'orb',b:55,c:'#5fd16a'}, fire_orb:{n:'화염 오브',cat:'orb',b:130,c:'#ff6a2a'},
 ancient_coin:{n:'고대 주화',cat:'val',b:70,c:'#f2bb4b'}, desert_relic:{n:'사막 유물',cat:'val',b:160,c:'#e8c27a'}, dragon_scale:{n:'용비늘',cat:'val',b:420,c:'#c23a4a'},
 iron_sword:{n:'철검',cat:'good',b:65,c:'#cfd6dc'}, r_shield:{n:'강화 방패',cat:'good',b:110,c:'#b9c4cc'},
 orb_staff:{n:'오브 지팡이',cat:'good',b:190,c:'#5fd16a'}, relic_blade:{n:'유물 장식검',cat:'good',b:520,c:'#f2bb4b'}, flame_sword:{n:'화염 대검',cat:'good',b:900,c:'#ff6a2a'},
 star_iron:{n:'별철',cat:'mat',b:300,c:'#b8c8ff'}, royal_seal:{n:'왕실 인장',cat:'val',b:900,c:'#e8d27a'}, elder_heart:{n:'고룡의 심장',cat:'orb',b:1500,c:'#c03050'},
 royal_blade:{n:'왕실 의장검',cat:'good',b:2600,c:'#e8d27a'},
};
const PEDDLER=[['bread',3],['torch',5],['rope',3]];
const SMITH=[{out:'iron_sword',lv:1,need:{iron_scrap:4}},{out:'r_shield',lv:1,need:{bone_shield:1,iron_scrap:3}},{out:'orb_staff',lv:2,need:{green_orb:1,iron_scrap:3,leather:1}},{out:'relic_blade',lv:3,need:{desert_relic:1,mithril:2}},{out:'flame_sword',lv:4,need:{fire_orb:2,mithril:3}},{out:'royal_blade',lv:5,need:{royal_seal:1,star_iron:2}}];
const GEAR={
 weapon:[{id:'w_iron',n:'낡은 철검',cp:40,lv:1,b:30,c:'#cfd6dc',need:{iron_scrap:3}},{id:'w_goblin',n:'고블린 강철검',cp:110,lv:1,b:80,c:'#a8b0a0',need:{iron_scrap:5,goblin_dagger:1}},{id:'w_mithril',n:'미스릴 검',cp:320,lv:2,b:260,c:'#8fe0e6',need:{mithril:2,iron_scrap:6}},{id:'w_flame',n:'화염검',cp:700,lv:3,b:650,c:'#ff6a2a',need:{fire_orb:1,mithril:3}},{id:'w_star',n:'별철 장검',cp:1500,lv:4,b:1800,c:'#b8c8ff',need:{star_iron:3,mithril:4}},{id:'w_elder',n:'고룡검',cp:3200,lv:5,b:4500,c:'#c03050',need:{elder_heart:1,star_iron:4,fire_orb:2}}],
 armor:[{id:'a_leather',n:'가죽 조끼',cp:35,lv:1,b:30,c:'#9a6438',need:{leather:3}},{id:'a_wolf',n:'늑대가죽 갑옷',cp:100,lv:1,b:75,c:'#c9c3b8',need:{wolf_pelt:3,leather:2}},{id:'a_bone',n:'뼈 갑주',cp:260,lv:2,b:220,c:'#e6dcc2',need:{bone_shield:2,iron_scrap:4}},{id:'a_dragon',n:'용비늘 갑옷',cp:800,lv:3,b:900,c:'#c23a4a',need:{dragon_scale:1,mithril:2}},{id:'a_star',n:'별철 판금갑',cp:1600,lv:4,b:1900,c:'#b8c8ff',need:{star_iron:3,dragon_scale:1}},{id:'a_elder',n:'고룡 비늘 갑주',cp:3400,lv:5,b:4800,c:'#c03050',need:{elder_heart:1,dragon_scale:2,star_iron:2}}]};
for(const k of ['weapon','armor'])GEAR[k].forEach(g=>{IT[g.id]={n:g.n,cat:'gear',slot:k==='weapon'?'w':'a',cp:g.cp,b:g.b,c:g.c}});
const UPG={smith:400,weapon:400,armor:400,store:250,dorm:300}, UPM=[1,3,8,20], MAXLV=5;
const STORE_CAP=[60,120,200,300,450], DORM_CAP=[3,5,7,9,12];
const upCost=f=>Math.round(UPG[f.type]*UPM[(f.lv||1)-1]);
const FAC={
 smith:{n:'대장간',d:'전리품 분해, 판매용 상품 제작',uniq:1},
 dorm:{n:'숙소',d:'길드원 수용 인원 증가 · 업그레이드로 확장'},
 store:{n:'창고',d:'보관 용량 증가 · 업그레이드로 확장'},
 weapon:{n:'무기고',d:'길드원 장착용 무기 제작',uniq:1},
 armor:{n:'방어구점',d:'길드원 장착용 방어구 제작',uniq:1}};
const Q=[
 {id:'q_tut',n:'마을 우물 정리',reg:'길드 앞마을',g:0,rec:50,t:12,max:1,loot:[['iron_scrap',0,1,5],['herb',0,1,2],['bread',1,1,3]]},

function buildShop(){if(S.shopBuilt)return;S.shopBuilt=true;floatAt('상점 개업!',77,SKY+10,'white');setup();checkTut();openShop()}

function rollGrade(p,min=0){const w=p.map((v,i)=>i>=min?v:0),sum=w.reduce((a,b)=>a+b,0);if(sum<=0)return min;let r=Math.random()*sum;for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i}return w.length-1}
function genQuest(g){const pool=Q.filter(q=>q.g===g&&q.id!=='q_tut');return{uid:uid(),tid:pickA(pool).id,g,locked:false,st:'open'}}
function refreshBoard(manual,silent){
 const B=BOARD[S.board.lv];const keep=S.board.quests.filter(q=>q.st==='away'||q.locked||q.tid==='q_tut'||q.lord);
 const fresh=[];for(let i=keep.filter(q=>!q.lord).length;i<B.slots;i++)fresh.push(genQuest(rollGrade(B.p)));
 if(fresh.length){if(fresh.some(q=>q.g>=2))S.board.pity=0;else{S.board.pity++;if(S.board.pity>=8){fresh[0]=genQuest(rollGrade(B.p,2));S.board.pity=0;toast('천장 발동! <b>희귀 이상</b> 의뢰가 등장했어요')}}}
 S.board.quests=keep.concat(fresh);S.board.next=now()+B.ref*1000;
 genApplicants();
 if(!silent&&!manual&&S.tut>=5)toast('게시판 의뢰가 갱신됐어요');

}
function genApplicants(){const lvMax=S.board.lv+1;S.applicants=Array.from({length:3},()=>mkMember(1+ri(lvMax)))}
function mkMember(lv){const cls=pickA(Object.keys(CLS));const used=new Set(S.members.map(m=>m.name));let name;let k=0;do{name=pickA(NAMES);k++}while(used.has(name)&&k<30);
 return{id:uid(),name,cls,lv,exp:0,w:null,a:null,busy:null,pal:{skin:pickA(SKIN),hair:pickA(HAIR),shirt:CLS[cls].shirt,pants:pickA(PANTS)}}}
function manualCost(){if(S.board.day!==today()){S.board.day=today();S.board.mc=0}const k=S.board.mc;if(k<2)return{t:'free',v:0};if(k<5)return{t:'coin',v:30*(k-1)};return{t:'gem',v:5}}
function probs(R){if(R<=RT[0][0])return RT[0][1].slice();for(let i=1;i<RT.length;i++)if(R<=RT[i][0]){const[a,pa]=RT[i-1],[b,pb]=RT[i],f=(R-a)/(b-a);return pa.map((v,k)=>v+(pb[k]-v)*f)}return RT[RT.length-1][1].slice()}
function rollRes(R){const p=probs(R);let r=Math.random()*100;for(let k=0;k<4;k++){r-=p[k];if(r<0)return 3-k}return 0}
function rollQty(res){let r=Math.random()*100,b=1;for(const[q,w]of[[1,50],[2,30],[3,15],[5,5]]){r-=w;if(r<0){b=q;break}}return Math.max(1,Math.round(b*RMUL[res]))}
function partyCP(ids){return ids.map(id=>S.members.find(m=>m.id===id)).filter(Boolean).reduce((a,m)=>a+cpOf(m),0)}
function dispatch(q,ids){const tpl=QT[q.tid];q.st='away';q.party=ids;q.start=now();q.end=now()+tpl.t*1000;q.locked=false;
 ids.forEach((id,k)=>{const m=S.members.find(x=>x.id===id);m.busy=q.uid;walkers.push({x:100+k*6,dir:-1,p:m.pal,ph:0});delete wander[id]});
 toast(`<b>${tpl.n}</b>(으)로 파견대가 출발했어요`);checkTut()}
function resolveQuest(q){
 const tpl=QT[q.tid],ms=(q.party||[]).map(id=>S.members.find(m=>m.id===id)).filter(Boolean);
 const R=partyCP(q.party||[])/tpl.rec,res=rollRes(R),loot=[];
 for(const[id,min,ch,fixed]of tpl.loot){if(res>=min&&Math.random()<ch)loot.push({id,q:fixed?Math.max(1,Math.round(fixed*(res>=2?1:RMUL[res]))):rollQty(res)})}
 const gain=Math.round(QEXP[tpl.g]*EMUL[res]),ups=[];
 for(const m of ms){m.busy=null;m.exp+=gain;while(m.exp>=needExp(m.lv)){m.exp-=needExp(m.lv);m.lv++;ups.push(m.name+' Lv'+m.lv)}walkers.push({x:-8-ri(10),dir:1,p:m.pal,ph:0})}
 const rw=tpl.reward?(res>=2?1:res===1?.5:0):0;if(tpl.g===5&&res>=2)S.lordRank++;
 S.crates.push({name:tpl.n,g:tpl.g,res,R,loot,exp:gain,ups,who:ms.map(m=>m.name),reward:tpl.reward?{coins:Math.round(tpl.reward.coins*rw),gems:Math.round(tpl.reward.gems*rw)}:null});q.st='done';
 refreshSheet('board');refreshSheet('members');
}

 if(old&&roomAfter(g)<1){toast('창고가 가득 차서 원래 장비를 보관할 수 없어요');return}
 consume(g.need);if(old)addItem(old,1);m[sl]=g.id;S.stats.crafted++;toast(`<b>${m.name}</b>에게 ${g.n} 장착 · 전투력 ${fmt(cpOf(m))}${old?' · '+IT[old].n+'은(는) 창고로':''}`);gearPick=null};
ACT.craftStore=d=>{const g=GEAR[d.f]&&GEAR[d.f][gearPick];if(!g||!has(g.need))return;if(roomAfter(g)<1){toast('창고가 가득 찼어요');return}consume(g.need);addItem(g.id,1);S.stats.crafted++;toast(`<b>${g.n}</b>을(를) 창고에 보관했어요`);gearPick=null};

/* LORD */
function bestParty(n){return S.members.map(cpOf).sort((a,b)=>b-a).slice(0,n).reduce((a,b)=>a+b,0)}
function openLord(){if(!S.lord)return;openSheet('lord','영주의 방문',()=>{if(!S.lord)return'<div class="note">영주가 돌아갔어요.</div>';const tpl=QT[S.lord.tid],bp=bestParty(tpl.max);
 return`<div class="card"><div class="row">${gp(5)}<span class="grow name">${tpl.lord}</span><span class="meta">기다리는 시간 <b class="num" data-end="${S.lord.until}">-</b></span></div><div class="note">"${tpl.line}"</div></div>
 <div class="card"><span class="name">${tpl.n}</span><div class="meta">${tpl.reg} · ${tpl.t}초 · 권장 전투력 <b class="num">${fmt(tpl.rec)}</b> · 최대 ${tpl.max}명</div>
 <div class="meta">우리 길드 최강 파티 <b class="num ${bp<tpl.rec*.8?'warn':''}">${fmt(bp)}</b> (R ${(bp/tpl.rec).toFixed(2)})</div>
 <div class="row" style="gap:4px">${tpl.loot.map(l=>icoImg(l[0])).join('')}<span class="meta" style="margin-left:4px">${tpl.loot.map(l=>IT[l[0]].n).join(', ')}</span></div>
 <div class="meta">사례금: 성공 이상 ${fmt(tpl.reward.coins)} 코인 + 보석 ${tpl.reward.gems} · 부분 성공은 절반</div></div>
 <div class="note">수락하면 게시판 맨 위에 영주 의뢰가 올라가요. 30분 안에 파견을 보내야 해요. 별철·고룡의 심장은 무기고·방어구점 Lv4~5 장비와 대장간 Lv5 상품의 재료예요.</div>
 <div class="row"><button class="btn ghost" data-act="lordNo">거절</button><span class="grow"></span><button class="btn gold" data-act="lordYes">의뢰 수락</button></div>`})}
ACT.lordYes=()=>{if(!S.lord)return;S.board.quests.unshift({uid:uid(),tid:S.lord.tid,g:5,locked:false,st:'open',lord:true,expires:now()+1800000});S.lord=null;S.lordNext=now()+240000;LS.st='out';toast('영주 의뢰를 수락했어요 · 게시판을 확인하세요');closeSheet()};
ACT.lordNo=()=>{S.lord=null;S.lordNext=now()+240000;LS.st='out';closeSheet()};

/* DIG */
function openDig(){openSheet('dig','굴착',()=>{
 const n=S.floors.length;
 if(S.pendingBuild){const opts=Object.entries(FAC).filter(([k,v])=>!(v.uniq&&count(k)));
  return`<div class="meta">B${n+1} · ${THEMES[theme(n)].n}</div>`+opts.map(([k,v])=>`<div class="card"><div class="row"><span class="grow"><span class="name">${v.n}</span><br><span class="meta">${v.d}</span></span><button class="btn sm" data-act="build" data-t="${k}">짓기</button></div></div>`).join('')}
 if(S.dig){const g=Math.max(1,Math.ceil((S.dig.end-now())/10000));return`<div class="card"><div class="row"><span class="grow name">B${n+1} 굴착 중</span><span class="num" data-end="${S.dig.end}">-</span></div><div class="prog"><i data-ps="${S.dig.start}" data-pe="${S.dig.end}"></i></div><div class="row"><span class="grow"></span><button class="btn ghost sm" data-act="digrush">보석 ${g}개로 완료</button></div></div>`}
 const c=digCost();
 return`<div class="card"><div class="row"><span class="grow"><span class="name">B${n+1} 굴착</span><br><span class="meta">${THEMES[theme(n)].n} · ${digTime()}초 · ${n===0?'지하 1층은 대장간으로 정해져 있어요':'굴착이 끝나면 지을 시설을 골라요'}</span></span><button class="btn gold" data-act="dig" ${S.coins<c?'disabled':''}>${fmt(c)} 코인</button></div>
 <div class="note">층이 깊어질수록 비용이 1.75배씩 늘어요. 깊이 구간: 1~3층 나무 지지대 지하실 · 4~6층 석조 회랑 · 7층부터 고대 유적.</div></div>`})}
ACT.dig=()=>{startDig()};
ACT.digrush=()=>{if(!S.dig)return;const g=Math.max(1,Math.ceil((S.dig.end-now())/10000));if(S.gems<g){toast('보석이 부족해요');return}S.gems-=g;S.dig.end=now()};
ACT.build=d=>{build(d.t)};

/* GUILD / RESULT */
function openGuild(){openSheet('guild','길드 외관',()=>{const t=tier(),next=[2,4,6][t];
 return`<div class="card"><span class="name">${TIERS[t]}</span><div class="meta">높이 쌓을 수 없는 고대 길드는 땅 아래로 넓혀가요. 지하층이 늘면 지상 외관이 바뀌어요.</div>${next?`<div class="meta">지하 ${next}층에 도달하면 <b>${TIERS[t+1]}</b>(으)로 성장 (현재 ${S.floors.length}층)</div>`:'<div class="meta">최고 단계에 도달했어요.</div>'}</div>`})}
function showResult(c){openSheet('result','파견 결과',()=>{
 return`<div class="meta" style="text-align:center">${gp(c.g)} ${c.name} · ${c.who.join(', ')} · R ${c.R.toFixed(2)}</div>
 <div class="big" style="color:${RESC[c.res]}">${RESN[c.res]}</div>
 <div class="card">${c.loot.length?c.loot.map(l=>`<div class="row">${icoImg(l.id)}<span class="grow">${IT[l.id].n}</span><span class="num">×${l.q}</span></div>`).join(''):'<div class="note">가져온 전리품이 없어요.</div>'}
 ${c.bonus&&c.bonus.length?`<div class="note"><b>운반 보너스</b> +1: ${c.bonus.join(', ')}</div>`:''}${c.lost?`<div class="note warn">창고가 가득 차서 ${c.lost}개를 잃었어요.</div>`:''}</div>
 ${c.reward?`<div class="card"><div class="row"><span class="grow"><b>영주 사례금</b></span>${c.reward.coins?`<span class="num">+${fmt(c.reward.coins)} 코인 · 보석 +${c.reward.gems}</span>`:'<span class="meta">부분 성공 이상이어야 받을 수 있어요</span>'}</div></div>`:''}
 <div class="meta" style="text-align:center">경험치 +${c.exp}${c.ups.length?' · <b>레벨 업!</b> '+c.ups.join(', '):''}</div>
 <button class="btn gold" data-act="closeR">확인</button>`})}
ACT.closeR=()=>{closeSheet()};

/* ───────── input ───────── */
cv.addEventListener('click',e=>{
 const r=cv.getBoundingClientRect(),lx=(e.clientX-r.left)/SC,ly=(e.clientY-r.top)/SC;
 if(L.st==='wait'&&lx>=LX0-4&&ly>=SKY-14&&ly<=SKY+FH){sendDown(true);return}
 if(ly<SKY){if(S.shopBuilt)openGuild();return}
 if(ly<SKY+FH){if(S.lord&&Math.abs(lx-LORD_X-2)<10){openLord();return}S.shopBuilt?openShop():buildShop();return}
 const i=Math.floor((ly-SKY-FH)/FH);
 if(i<S.floors.length)openFacility(i);else if(i===S.floors.length&&S.shopBuilt)openDig();
});
$('#crateBtn').onclick=()=>sendDown(true);
$('#lordBtn').onclick=()=>openLord();
const NAV={board:()=>openBoard(),members:openMembers,storage:openStorage,ledger:openLedger};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>NAV[b.dataset.nav]());
(function navIcons(){const ic=[[['#8a5a2b',0,1,11,8],['#e4d3ae',1,2,9,6],['#2b1d12',2,3,4,1],['#2b1d12',2,5,5,1],['#c0392b',8,3,2,2],['#6b4626',1,9,1,2],['#6b4626',9,9,1,2]],
 [['#f1c9a0',3,0,5,4],['#3b2a1e',3,0,5,1],['#b8483a',2,4,7,5],['#3a3f5a',3,9,2,2],['#3a3f5a',6,9,2,2]],
 [['#a0703f',1,2,9,8],['#c08a52',1,2,9,1],['#6b4626',1,9,9,1],['#6b4626',5,2,1,8]],
 [['#efe2c4',1,1,9,10],['#b8862a',1,1,1,10],['#6b5440',3,3,5,1],['#6b5440',3,5,5,1],['#6b5440',3,7,3,1]]];
 document.querySelectorAll('#nav .nic').forEach((c,k)=>{const g=c.getContext('2d');for(const[col,x,y,w,h]of ic[k]){g.fillStyle=col;g.fillRect(x,y,w,h)}})})();

/* ───────── ticker ───────── */
let saveT=0;
function tickSheet(){if(!cur)return;const t=now();
 body.querySelectorAll('[data-end]').forEach(el=>{el.textContent=mmss(+el.dataset.end-t)});
 body.querySelectorAll('[data-ps]').forEach(el=>{const a=+el.dataset.ps,b=+el.dataset.pe;el.style.width=Math.min(100,Math.max(0,(t-a)/(b-a)*100))+'%'})}
setInterval(()=>{
 $('#coins').textContent=fmt(S.coins);$('#gems').textContent=fmt(S.gems);$('#tier').textContent=TIERS[tier()];
 $('#trend').innerHTML=`유행 <b>${CAT[S.trend.cat]}</b> ×1.5 · <span class="num">${mmss(S.trend.until-now())}</span><span class="speed">PROTO · 시간 가속</span>`;
 if(digBarEl&&S.dig){const p=Math.min(1,(now()-S.dig.start)/(S.dig.end-S.dig.start));digBarEl.firstChild.style.width=(p*100)+'%';digBarEl.lastChild.textContent=mmss(S.dig.end-now())}
 $('#crateBtn').hidden=!(L.st==='wait');$('#lordBtn').hidden=!S.lord;
 const nb=$('#nBoard');nb.classList.toggle('locked',!S.board.on);const away=S.board.quests.filter(q=>q.st==='away').length,bd=nb.querySelector('.badge');bd.hidden=!away;bd.textContent=away;
 tickSheet();checkTut();
 if(++saveT%20===0)save();
},250);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('resize',setup);
new ResizeObserver(()=>{if(Math.abs(tower.clientWidth/W-SC)>.01)setup()}).observe(tower);

/* ───────── boot ───────── */
function start(data){
 if(data&&data.S)S=data.S;else load();
 if(!S.trend.until)S.trend={cat:'con',until:now()+150000};
 setup();checkTut();requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
window.__tg={get S(){return S},openLord,LS,ACT,openShop,openBoard,openFacility,openDig,openStorage,openMembers,openLedger,buildShop,closeSheet,sendDown,L};
})();
</script>
</body>
</html>
