// 좌표: 발 아래 지면이 원점, x 앞쪽(+), y 위쪽(+). 단위 px (scale 1)
const RIG = { thigh:22, shin:22, torso:27, upper:15, fore:15, head:7, sword:52, tsuka:9 };

function ik(ax,ay,tx,ty,l1,l2,side){
  let dx=tx-ax, dy=ty-ay, d=Math.hypot(dx,dy);
  d = Math.max(Math.abs(l1-l2)+0.05, Math.min(l1+l2-0.05, d));
  const a = Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d)), base = Math.atan2(dy,dx), ang = base+side*a;
  const jx = ax+Math.cos(ang)*l1, jy = ay+Math.sin(ang)*l1;
  const e = Math.atan2(ty-jy, tx-jx);
  return [jx,jy, jx+Math.cos(e)*l2, jy+Math.sin(e)*l2];
}

function lerp(a,b,t){
  if (Array.isArray(a)) return a.map((v,i)=>lerp(v,b[i],t));
  if (typeof a==='object' && a) { const o={}; for (const k in a) o[k] = (k in b) ? lerp(a[k],b[k],t) : a[k]; for (const k in b) if(!(k in a)) o[k]=b[k]; return o; }
  if (typeof a==='number') return a+(b-a)*t;
  return t<1 ? a : b;
}
const EASE = {
  smooth: t => t*t*(3-2*t),
  in:  t => t*t*t,               // 가속 (예비동작 → 타격 순간)
  out: t => 1-Math.pow(1-t,3),   // 감속 (타격 → 정지)
  lin: t => t,
  snap: t => t<0.7 ? Math.pow(t/0.7,4)*0.98 : 0.98+0.02*((t-0.7)/0.3),
};

// 키프레임: {t, p:포즈(부분 오버라이드 가능), e:이징, fx:{type,x,y,dur}}
function build(kfs){
  const out = []; let cur = { ...READY, en:null };
  for (const k of kfs){
    const p = { ...cur };
    for (const key in k.p||{}) p[key] = (key==='en' && cur.en && k.p.en) ? { ...cur.en, ...k.p.en } : k.p[key];
    cur = p; out.push({ t:k.t, p, e:k.e||'smooth', fx:k.fx||null });
  }
  return out;
}
function sample(kfs, t){
  if (t <= kfs[0].t) return kfs[0].p;
  for (let i=1;i<kfs.length;i++){
    if (t <= kfs[i].t){ const a=kfs[i-1], b=kfs[i]; const u = (t-a.t)/(b.t-a.t); return lerp(a.p, b.p, EASE[b.e](u)); }
  }
  return kfs[kfs.length-1].p;
}

// ───────── 그리기 ─────────
function drawFigure(ctx, p, color, swordColor, opts={}){
  const s = opts.scale||1;
  ctx.save();
  // 회전(pitch): 몸 중심 기준
  if (p.pitch){ const cx = p.hx, cy = p.hy+8; ctx.translate(cx,cy); ctx.rotate(-p.pitch); ctx.translate(-cx,-cy); }
  if (p.yaw){ const c = Math.cos(p.yaw); ctx.translate(p.hx,0); ctx.scale(Math.max(0.12,Math.abs(c))*Math.sign(c||1),1); ctx.translate(-p.hx,0); }
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=color; ctx.lineWidth=3.2;
  const hx=p.hx, hy=p.hy;
  const sx = hx + Math.sin(p.lean)*RIG.torso, sy = hy + Math.cos(p.lean)*RIG.torso;      // 어깨
  const nx = sx + Math.sin(p.lean+p.head)*(RIG.head+4), ny = sy + Math.cos(p.lean+p.head)*(RIG.head+4); // 머리 중심
  // 다리
  for (const f of [p.fL,p.fR]){ const [kx,ky,ex,ey] = ik(hx,hy,f[0],f[1],RIG.thigh,RIG.shin,+1);
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(kx,ky); ctx.lineTo(ex,ey); ctx.stroke(); if (opts.joints) dot(ctx,kx,ky); }
  // 몸통·머리
  ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(sx,sy); ctx.stroke();
  ctx.beginPath(); ctx.arc(nx,ny,RIG.head,0,Math.PI*2); ctx.stroke();
  // 검 방향
  const dx = Math.cos(p.sw), dy = Math.sin(p.sw);
  const hand = p.hand;
  // 왼팔: 양손이면 그립 뒤쪽, 아니면 lh
  const shx = sx - Math.sin(p.lean)*2, shy = sy - 2;
  const lt = p.two > 0.5 ? [hand[0]-dx*7, hand[1]-dy*7] : p.lh;
  const la = ik(shx,shy,lt[0],lt[1],RIG.upper,RIG.fore,-1);
  ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.moveTo(shx,shy); ctx.lineTo(la[0],la[1]); ctx.lineTo(la[2],la[3]); ctx.stroke(); ctx.globalAlpha = 1;
  // 오른팔
  const ra = ik(shx,shy,hand[0],hand[1],RIG.upper,RIG.fore,-1);
  ctx.beginPath(); ctx.moveTo(shx,shy); ctx.lineTo(ra[0],ra[1]); ctx.lineTo(ra[2],ra[3]); ctx.stroke();
  if (opts.joints){ dot(ctx,shx,shy); dot(ctx,ra[0],ra[1]); dot(ctx,la[0],la[1]); dot(ctx,hx,hy); }
  // 검
  const gx = ra[2], gy = ra[3];
  ctx.strokeStyle = '#6b3a20'; ctx.lineWidth = 3.6; ctx.beginPath(); ctx.moveTo(gx-dx*RIG.tsuka, gy-dy*RIG.tsuka); ctx.lineTo(gx+dx*3, gy+dy*3); ctx.stroke();
  ctx.strokeStyle = swordColor; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(gx+dx*3, gy+dy*3); ctx.lineTo(gx+dx*RIG.sword, gy+dy*RIG.sword); ctx.stroke();
  ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(gx+dx*3-dy*3.5, gy+dy*3+dx*3.5); ctx.lineTo(gx+dx*3+dy*3.5, gy+dy*3-dx*3.5); ctx.stroke(); // 코등이
  ctx.restore();
  // 검 끝 월드 좌표 (yaw/pitch 반영)
  let tx = gx+dx*RIG.sword, ty = gy+dy*RIG.sword;
  if (p.yaw){ const c = Math.cos(p.yaw); tx = p.hx + (tx-p.hx)*Math.max(0.12,Math.abs(c))*Math.sign(c||1); }
  if (p.pitch){ const cx=p.hx, cy=p.hy+8, a=-p.pitch, ox=tx-cx, oy=ty-cy; tx = cx+ox*Math.cos(a)-oy*Math.sin(a); ty = cy+ox*Math.sin(a)+oy*Math.cos(a); }
  return [tx,ty];
}
function dot(ctx,x,y){ ctx.save(); ctx.fillStyle='#e8c170'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill(); ctx.restore(); }

function drawFX(ctx, fx, u, face){
  if (fx.type==='spark'){ ctx.save(); ctx.strokeStyle='#ffc86b'; ctx.lineWidth=2; ctx.globalAlpha=1-u;
    for (let i=0;i<10;i++){ const a=i/10*Math.PI*2+0.3, r1=6+u*22, r2=r1+8; ctx.beginPath(); ctx.moveTo(fx.x+Math.cos(a)*r1, fx.y+Math.sin(a)*r1); ctx.lineTo(fx.x+Math.cos(a)*r2, fx.y+Math.sin(a)*r2); ctx.stroke(); } ctx.restore(); }
  else if (fx.type==='wave'){ ctx.save(); ctx.strokeStyle='#dfe8ff'; ctx.globalAlpha=(1-u)*0.9; ctx.lineWidth=3;
    const r = 20+u*120; ctx.beginPath(); ctx.arc(fx.x-r*0.8, fx.y, r, -0.5, 0.5); ctx.stroke(); ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(fx.x-r*0.8, fx.y, r*0.85, -0.45, 0.45); ctx.stroke(); ctx.restore(); }
  else if (fx.type==='blood'){ ctx.save(); ctx.fillStyle='#d0202a'; ctx.globalAlpha=1-u*u;
    for (let i=0;i<9;i++){ const a=0.2+i*0.35, r=u*(18+i*5); ctx.beginPath(); ctx.arc(fx.x+Math.cos(a)*r, fx.y+Math.sin(a)*r-u*u*30, 1.6+(i%3), 0, Math.PI*2); ctx.fill(); } ctx.restore(); }
  else if (fx.type==='danger'){ ctx.save(); ctx.scale(face,-1); ctx.globalAlpha = Math.sin(u*Math.PI*6)>0?1:0.5; ctx.fillStyle='#ff2a2a'; ctx.font='bold 26px serif'; ctx.textAlign='center'; ctx.fillText('危', fx.x*face, -fx.y); ctx.restore(); }
}

// ───────── 카드 생성 & 루프 ─────────
const grid = document.getElementById('grid');
const spd = document.getElementById('spd'), spdv = document.getElementById('spdv');
const trailChk = document.getElementById('trail'), onionChk = document.getElementById('onion'), jointsChk = document.getElementById('joints');
spd.oninput = () => spdv.textContent = spd.value + 'x';
const cards = [];
for (const m of MOTIONS){
  if (m.sec){ const d = document.createElement('div'); d.className='sec'; d.textContent = m.sec; grid.append(d); continue; }
  const card = document.createElement('div'); card.className = 'card' + (m.boss?' boss':'');
  card.innerHTML = `<h3>${m.name}<span>${m.jp}</span></h3><p>${m.note}</p><canvas width="640" height="400"></canvas><div class="bar"><i></i></div>`;
  grid.append(card);
  const cv = card.querySelector('canvas'), ctx = cv.getContext('2d');
  const kfs = build(m.kf), dur = kfs[kfs.length-1].t;
  const c = { m, cv, ctx, kfs, dur, t:0, paused:false, trail:[], bar:card.querySelector('.bar i') };
  cards.push(c);
  const scrub = e => { const r = cv.getBoundingClientRect(); c.t = Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*dur; c.paused = true; c.trail.length=0; };
  cv.addEventListener('mousedown', e => { scrub(e); const mv = ev => scrub(ev); const up = () => { removeEventListener('mousemove',mv); removeEventListener('mouseup',up); }; addEventListener('mousemove',mv); addEventListener('mouseup',up); });
  cv.addEventListener('dblclick', () => { c.paused = false; });
}

function renderCard(c, dt){
  const { ctx, cv, m } = c;
  if (!c.paused){ c.t += dt*+spd.value; if (c.t > c.dur){ c.t = 0; c.trail.length = 0; } }
  c.bar.style.width = (c.t/c.dur*100)+'%';
  const p = sample(c.kfs, c.t);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#1a1b22'; ctx.fillRect(0,0,cv.width,cv.height);
  // 월드 변환: 원점 = (180, 340) px, scale 2, y 위로
  const S = 1.8, ox = m.boss ? 400 : 180, oy = 372;
  const face = m.boss ? -1 : 1;
  ctx.setTransform(S*face,0,0,-S,ox,oy);
  // 지면
  ctx.strokeStyle='#3a3c48'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-200,0); ctx.lineTo(300,0); ctx.stroke();
  // 잔상
  if (onionChk.checked){ for (let k=1;k<=4;k++){ const q = sample(c.kfs, Math.max(0,c.t - k*45)); ctx.globalAlpha = 0.16 - k*0.03; drawFigure(ctx,q,'#8fa3c4','#8fa3c4'); if (q.en) drawFigure(ctx,{...q.en,hx:q.en.hx},'#6a6a70','#6a6a70',{}); } ctx.globalAlpha = 1; }
  // 궤적
  if (trailChk.checked && c.trail.length>1){
    ctx.lineCap='round';
    for (let i=1;i<c.trail.length;i++){ const a = c.trail[i], b = c.trail[i-1]; const age = (c.t - a.t);
      if (age > 160 || age < 0) continue; ctx.globalAlpha = (1-age/160)*0.85; ctx.strokeStyle = m.trail || '#cfe0ff'; ctx.lineWidth = 3.5*(1-age/160)+0.5;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(a.x,a.y); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  // 적(소품)
  if (p.en){ ctx.save(); ctx.translate(p.en.hx,0); ctx.scale(-1,1); drawFigure(ctx,{...p.en,hx:0},'#7c7c86','#9aa3b5',{joints:false}); ctx.restore(); }
  if (p.blade){ const [bx,by,ba] = p.blade; ctx.save(); ctx.strokeStyle='#c07070'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+Math.cos(ba)*70, by+Math.sin(ba)*70); ctx.stroke();
    ctx.strokeStyle='#6b3a20'; ctx.lineWidth=3.6; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx-Math.cos(ba)*8, by-Math.sin(ba)*8); ctx.stroke(); ctx.restore(); }
  // 본체
  const color = m.boss ? '#f1d6c8' : '#f4f1ea';
  const tip = drawFigure(ctx, p, color, m.boss ? '#e8c9c9' : '#dfe8f5', { joints: jointsChk.checked });
  if (!c.paused){ c.trail.push({ x:tip[0], y:tip[1], t:c.t }); if (c.trail.length > 40) c.trail.shift(); }
  // FX
  for (const k of c.kfs){ if (k.fx && c.t >= k.t && c.t < k.t + k.fx.dur) drawFX(ctx, k.fx, (c.t-k.t)/k.fx.dur, face); }
  // 시간 표시
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#666'; ctx.font='12px monospace'; ctx.textAlign='right'; ctx.fillText(Math.round(c.t)+' / '+c.dur+' ms', cv.width-8, 16);
}
let last = performance.now();
function loop(ts){ const dt = Math.min(50, ts-last); last = ts; for (const c of cards) renderCard(c, dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
